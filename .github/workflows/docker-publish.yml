name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Unified Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          TOKEN_1: ${{ secrets.DOCKERHUB_TOKEN }}
          TOKEN_2: ${{ secrets.DOCKER_HUB_TOKEN }}
          TOKEN_3: ${{ secrets.DOCKER_TOKEN }}
          TOKEN_4: ${{ secrets.DOCKERHUB_PASSWORD }}
          TOKEN_5: ${{ vars.DOCKERHUB_TOKEN }}
        run: |
          TOKEN="$TOKEN_1"
          if [ -z "$TOKEN" ]; then TOKEN="$TOKEN_2"; fi
          if [ -z "$TOKEN" ]; then TOKEN="$TOKEN_3"; fi
          if [ -z "$TOKEN" ]; then TOKEN="$TOKEN_4"; fi
          if [ -z "$TOKEN" ]; then TOKEN="$TOKEN_5"; fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No Docker Hub token found in secrets or variables! Please add DOCKERHUB_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$TOKEN" | docker login -u sivapn --password-stdin

      - name: Build and Push Unified Traffic AI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            sivapn/traffic-ai:latest
            sivapn/traffic-ai:${{ github.sha }}
