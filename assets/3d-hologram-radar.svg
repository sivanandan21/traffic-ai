<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 250" width="100%" height="250">
  <defs>
    <style>
      @keyframes spin3D {
        0% { transform: rotateY(0deg) rotateX(25deg); }
        50% { transform: rotateY(180deg) rotateX(-15deg); }
        100% { transform: rotateY(360deg) rotateX(25deg); }
      }
      @keyframes gridTravel {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateY(140px); opacity: 0.1; }
      }
      @keyframes beamScan {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(160px); }
      }
      @keyframes waveBar {
        0%, 100% { height: 12px; }
        50% { height: 48px; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 4px #00f0ff); opacity: 0.9; }
        50% { filter: drop-shadow(0 0 12px #ff2a85); opacity: 1; }
      }
      @keyframes floatHUD {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes targetSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; }
      .font-bold { font-family: 'Space Grotesk', sans-serif; font-weight: 800; }
      .cube-spin { transform-origin: 110px 130px; animation: spin3D 8s linear infinite; }
      .beam { animation: beamScan 2.2s ease-in-out infinite; }
      .wave-1 { animation: waveBar 0.9s ease-in-out infinite; }
      .wave-2 { animation: waveBar 1.2s ease-in-out infinite 0.2s; }
      .wave-3 { animation: waveBar 0.7s ease-in-out infinite 0.4s; }
      .wave-4 { animation: waveBar 1.5s ease-in-out infinite 0.1s; }
      .wave-5 { animation: waveBar 1.1s ease-in-out infinite 0.3s; }
      .wave-6 { animation: waveBar 0.8s ease-in-out infinite 0.5s; }
      .target-ring { transform-origin: 475px 125px; animation: targetSpin 12s linear infinite; }
    </style>
    
    <pattern id="hazard3d" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#ffe600" />
      <rect x="10" width="10" height="20" fill="#000000" />
    </pattern>
  </defs>

  <!-- Neo-Brutalist Hard Drop Shadow -->
  <rect x="10" y="10" width="930" height="230" rx="4" fill="#ffe600" />

  <!-- Main Chassis -->
  <rect x="4" y="4" width="930" height="230" rx="4" fill="#0b0d18" stroke="#000000" stroke-width="3" />

  <!-- Top Caution Hazard Tape -->
  <rect x="4" y="4" width="930" height="8" fill="url(#hazard3d)" />
  <line x1="4" y1="12" x2="934" y2="12" stroke="#000000" stroke-width="2" />

  <!-- ==================== MODULE 1: 3D ROTATING TARGET RETICLE (LEFT) ==================== -->
  <g transform="translate(15, 25)">
    <!-- Sub-panel border -->
    <rect x="0" y="0" width="230" height="195" fill="#101322" stroke="#252d47" stroke-width="1.5" rx="3" />
    <rect x="0" y="0" width="230" height="22" fill="#000000" />
    <text x="10" y="15" fill="#00f0ff" class="font-mono" font-weight="700">[ 3D SPATIAL RETICLE // 立体走査 ]</text>
    
    <!-- 3D Target Center Box -->
    <g class="cube-spin">
      <!-- 3D Wireframe Cube Simulation -->
      <polygon points="110,65 155,90 110,115 65,90" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="2,2" />
      <polygon points="110,135 155,160 110,185 65,160" fill="none" stroke="#00f0ff" stroke-width="1.8" />
      <line x1="110" y1="65" x2="110" y2="135" stroke="#ffe600" stroke-width="2" />
      <line x1="155" y1="90" x2="155" y2="160" stroke="#ff2a85" stroke-width="2" />
      <line x1="65" y1="90" x2="65" y2="160" stroke="#ff2a85" stroke-width="2" />
      <circle cx="110" cy="125" r="4" fill="#ffe600" />
    </g>

    <!-- Corner HUD Brackets -->
    <path d="M 20,40 L 20,32 L 30,32" stroke="#ffe600" stroke-width="2" fill="none" />
    <path d="M 210,40 L 210,32 L 200,32" stroke="#ffe600" stroke-width="2" fill="none" />
    <path d="M 20,175 L 20,185 L 30,185" stroke="#ffe600" stroke-width="2" fill="none" />
    <path d="M 210,175 L 210,185 L 200,185" stroke="#ffe600" stroke-width="2" fill="none" />

    <text x="18" y="178" fill="#ffe600" class="font-mono" font-weight="700">LOCK: #VEHICLE-089</text>
  </g>

  <!-- ==================== MODULE 2: 3D CYBER HIGHWAY PERSPECTIVE (CENTER) ==================== -->
  <g transform="translate(260, 25)">
    <rect x="0" y="0" width="415" height="195" fill="#080a12" stroke="#252d47" stroke-width="1.5" rx="3" />
    <rect x="0" y="0" width="415" height="22" fill="#000000" />
    <text x="10" y="15" fill="#ffe600" class="font-mono" font-weight="700">[ 3D PERSPECTIVE HIGHWAY MATRIX // 仮想道路網 ]</text>
    <text x="315" y="15" fill="#00ff88" class="font-mono" font-weight="700">● 60 FPS SYNC</text>

    <!-- Perspective Vanishing Grid -->
    <g>
      <!-- Horizon -->
      <line x1="0" y1="45" x2="415" y2="45" stroke="#ff2a85" stroke-width="1.5" stroke-opacity="0.8" />

      <!-- Perspective Lanes -->
      <line x1="207" y1="45" x2="20" y2="195" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.7" />
      <line x1="207" y1="45" x2="115" y2="195" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8,6" />
      <line x1="207" y1="45" x2="207" y2="195" stroke="#ffe600" stroke-width="2" stroke-dasharray="12,8" />
      <line x1="207" y1="45" x2="300" y2="195" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8,6" />
      <line x1="207" y1="45" x2="395" y2="195" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.7" />

      <!-- Forward Moving Laser Scan Beam -->
      <g class="beam">
        <line x1="40" y1="48" x2="375" y2="48" stroke="#00f0ff" stroke-width="2.5" style="filter: drop-shadow(0 0 6px #00f0ff);" />
        <circle cx="207" cy="48" r="4" fill="#ffffff" />
      </g>
    </g>

    <!-- HUD Overlay Target Reticle -->
    <circle cx="207" cy="115" r="30" stroke="#ff2a85" stroke-width="1.2" fill="none" stroke-dasharray="4,4" class="target-ring" />
    <line x1="165" y1="115" x2="249" y2="115" stroke="#ff2a85" stroke-width="1" stroke-opacity="0.5" />
    <line x1="207" y1="73" x2="207" y2="157" stroke="#ff2a85" stroke-width="1" stroke-opacity="0.5" />

    <text x="12" y="180" fill="#ffffff" class="font-mono" font-size="10">NEURAL TRACKING: 4 LANES • TENSOR CORES ACTIVE</text>
  </g>

  <!-- ==================== MODULE 3: REAL-TIME TELEMETRY SPECTRUM (RIGHT) ==================== -->
  <g transform="translate(690, 25)">
    <rect x="0" y="0" width="240" height="195" fill="#101322" stroke="#252d47" stroke-width="1.5" rx="3" />
    <rect x="0" y="0" width="240" height="22" fill="#000000" />
    <text x="10" y="15" fill="#ff2a85" class="font-mono" font-weight="700">[ TELEMETRY EQUALIZER // 解析情報 ]</text>

    <!-- Animated Audio/Telemetry Spectrum Bars -->
    <g transform="translate(25, 45)">
      <rect x="0" y="55" width="18" height="20" fill="#00f0ff" rx="2" class="wave-1" />
      <rect x="25" y="55" width="18" height="35" fill="#ffe600" rx="2" class="wave-2" />
      <rect x="50" y="55" width="18" height="18" fill="#ff2a85" rx="2" class="wave-3" />
      <rect x="75" y="55" width="18" height="42" fill="#00ff88" rx="2" class="wave-4" />
      <rect x="100" y="55" width="18" height="30" fill="#00f0ff" rx="2" class="wave-5" />
      <rect x="125" y="55" width="18" height="25" fill="#ffe600" rx="2" class="wave-6" />
      <rect x="150" y="55" width="18" height="45" fill="#ff2a85" rx="2" class="wave-2" />
      <rect x="175" y="55" width="18" height="22" fill="#00ff88" rx="2" class="wave-3" />
    </g>

    <!-- Digital Telemetry Matrix -->
    <g transform="translate(15, 120)">
      <line x1="0" y1="0" x2="210" y2="0" stroke="#252d47" stroke-width="1" />
      <text x="4" y="20" fill="#9aa4bf" class="font-mono">INFERENCE SPEED:</text>
      <text x="145" y="20" fill="#00f0ff" class="font-mono" font-weight="700">~28 ms</text>

      <text x="4" y="40" fill="#9aa4bf" class="font-mono">CONGESTION INDEX:</text>
      <text x="145" y="40" fill="#ffe600" class="font-mono" font-weight="700">HIGH (82%)</text>

      <text x="4" y="60" fill="#9aa4bf" class="font-mono">SYSTEM INTEGRITY:</text>
      <text x="145" y="60" fill="#00ff88" class="font-mono" font-weight="700">NOMINAL</text>
    </g>
  </g>
</svg>
