<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="130">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.92); }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.8; }
        50% { opacity: 0.3; }
        100% { transform: translateY(130px); opacity: 0.8; }
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blinkFast {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.2; }
      }
      @keyframes neonGlow {
        0%, 100% { filter: drop-shadow(0 0 4px #ffe600); }
        50% { filter: drop-shadow(0 0 10px #ff2a85); }
      }
      .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .font-sans { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }
      .radar-sweep { transform-origin: 65px 65px; animation: radarSweep 3s linear infinite; }
      .pulse-dot { animation: blinkFast 1s steps(1) infinite; }
      .glow-text { animation: neonGlow 4s ease-in-out infinite; }
      .scan-beam { animation: scanline 2.5s ease-in-out infinite; }
    </style>
    <pattern id="hazard" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#ffe600" />
      <rect x="10" width="10" height="20" fill="#000000" />
    </pattern>
    <linearGradient id="cyanFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Brutalist Shadow -->
  <rect x="12" y="12" width="880" height="110" rx="4" fill="#ffe600" />
  
  <!-- Main Chassis -->
  <rect x="6" y="6" width="880" height="110" rx="4" fill="#090a10" stroke="#000000" stroke-width="3" />

  <!-- Top Caution Strip -->
  <rect x="6" y="6" width="880" height="8" fill="url(#hazard)" />
  <line x1="6" y1="14" x2="886" y2="14" stroke="#000000" stroke-width="2" />

  <!-- Radar Module (Left) -->
  <circle cx="65" cy="70" r="38" fill="#10121d" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="65" cy="70" r="24" fill="none" stroke="#2a324b" stroke-width="1" />
  <circle cx="65" cy="70" r="10" fill="none" stroke="#2a324b" stroke-width="1" />
  <line x1="65" y1="32" x2="65" y2="108" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1" />
  <line x1="27" y1="70" x2="103" y2="70" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1" />
  
  <!-- Radar Sweep -->
  <line x1="65" y1="70" x2="95" y2="45" stroke="#ffe600" stroke-width="2" class="radar-sweep" stroke-linecap="round" />
  <circle cx="82" cy="58" r="3" fill="#ff2a85" class="pulse-dot" />

  <!-- Center Text Data -->
  <text x="130" y="44" fill="#00f0ff" class="font-mono" font-size="10" font-weight="700" letter-spacing="2">[ HUD // 視覚ニューラル検知システム VER 3.4 ]</text>
  
  <text x="130" y="74" fill="#ffffff" class="font-sans glow-text" font-size="24" font-weight="900" letter-spacing="1">TRAFFIC-AI MATRIX</text>
  <text x="395" y="74" fill="#ffe600" class="font-sans" font-size="16" font-weight="800">:: YOLOv11 VISION ENGINE</text>

  <text x="130" y="98" fill="#9aa4bf" class="font-mono" font-size="11">LIVE TELEMETRY: CARS • BIKES • PEDESTRIANS • DYNAMIC CONGESTION INDEX</text>

  <!-- Right Status Badge (Neo-Brutalist Sticker) -->
  <g transform="translate(680, 32)">
    <rect x="4" y="4" width="190" height="66" rx="2" fill="#ff2a85" />
    <rect x="0" y="0" width="190" height="66" rx="2" fill="#131524" stroke="#000000" stroke-width="2.5" />
    
    <!-- Status Indicator -->
    <circle cx="20" cy="22" r="6" fill="#00ff88" class="pulse-dot" />
    <text x="34" y="26" fill="#00ff88" class="font-mono" font-size="12" font-weight="800" letter-spacing="1">ONLINE // 稼働中</text>
    
    <line x1="10" y1="36" x2="180" y2="36" stroke="#2a324b" stroke-width="1" />

    <text x="14" y="52" fill="#ffe600" class="font-mono" font-size="10" font-weight="700">AWS: 65.2.194.60</text>
    <text x="110" y="52" fill="#00f0ff" class="font-mono" font-size="10" font-weight="700">PORT: 80 [NGINX]</text>
  </g>
</svg>
