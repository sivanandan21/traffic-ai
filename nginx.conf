server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Maximum file upload size (matching and exceeding backend 10MB limit)
    client_max_body_size 25M;

    # Enable Gzip compression for frontend assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Frontend web root directory
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static asset files (images, vectors, mockups)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Redirect /api to /api/
    location = /api {
        return 301 /api/;
    }

    # Reverse proxy API traffic to the FastAPI backend container
    # /api/health  -> http://backend:8000/api/health
    # /api/analyze -> http://backend:8000/api/analyze
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Proxy connection headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable request and response buffering for instant upload streaming
        proxy_request_buffering off;
        proxy_buffering off;

        # Timeouts accommodated for YOLO AI inference and AWS S3 upload
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Serve static HTML/CSS/JS files
    # Try exact match ($uri), HTML extension ($uri.html), directory ($uri/),
    # and fallback to index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
